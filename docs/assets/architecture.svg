<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
<title id="title">Midnight Reminder system architecture</title>
<desc id="desc">Pi Runtime loads a thin runtime adapter that creates the core engine. Clock, Policy, and Storage are injected dependencies. Storage persists the last-reminded date. The core engine invokes a Pi UI notification callback.</desc>
<rect width="720" height="980" rx="24" fill="#0E0D0C"/>
<text x="44" y="62" fill="#B66A45" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="2">SYSTEM ARCHITECTURE</text>
<text x="44" y="106" fill="#F4E9DA" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="750">Thin runtime. Testable core.</text>
<text x="44" y="140" fill="#B1A598" font-family="Inter,system-ui,sans-serif" font-size="18">Pi wiring stays separate from time, policy, and persistence.</text>

<g font-family="Inter,system-ui,sans-serif">
  <rect x="80" y="202" width="560" height="104" rx="20" fill="#181613" stroke="#3C3732"/>
  <text x="112" y="244" fill="#F4E9DA" font-size="26" font-weight="700">Pi Runtime</text>
  <text x="112" y="276" fill="#B1A598" font-size="18">session_start · session_shutdown</text>

  <text x="360" y="342" text-anchor="middle" fill="#B66A45" font-size="28" font-weight="700">↓</text>

  <rect x="80" y="370" width="560" height="112" rx="20" fill="#7A2E3A" stroke="#B66A45"/>
  <text x="112" y="414" fill="#F4E9DA" font-size="26" font-weight="700">Runtime Adapter</text>
  <text x="112" y="448" fill="#F4E9DA" font-size="18">.pi/extensions/midnight-reminder.ts</text>

  <text x="360" y="518" text-anchor="middle" fill="#B66A45" font-size="28" font-weight="700">↓</text>

  <rect x="80" y="546" width="560" height="112" rx="20" fill="#181613" stroke="#3C3732"/>
  <text x="112" y="590" fill="#F4E9DA" font-size="26" font-weight="700">Core Engine</text>
  <text x="112" y="624" fill="#B1A598" font-size="18">MidnightReminderExtension</text>

  <text x="44" y="708" fill="#82786F" font-size="15" font-weight="700" letter-spacing="1.4">INJECTED DEPENDENCIES</text>

  <rect x="44" y="734" width="190" height="76" rx="18" fill="#201D1A" stroke="#3C3732"/>
  <text x="139" y="781" text-anchor="middle" fill="#F4E9DA" font-size="22" font-weight="700">Clock</text>

  <rect x="265" y="734" width="190" height="76" rx="18" fill="#201D1A" stroke="#3C3732"/>
  <text x="360" y="781" text-anchor="middle" fill="#F4E9DA" font-size="22" font-weight="700">Policy</text>

  <rect x="486" y="734" width="190" height="76" rx="18" fill="#201D1A" stroke="#3C3732"/>
  <text x="581" y="781" text-anchor="middle" fill="#F4E9DA" font-size="22" font-weight="700">Storage</text>

  <text x="581" y="842" text-anchor="middle" fill="#B66A45" font-size="24" font-weight="700">↓</text>
  <rect x="424" y="860" width="252" height="60" rx="16" fill="#181613" stroke="#3C3732"/>
  <text x="550" y="897" text-anchor="middle" fill="#B1A598" font-size="17">state.json · last-reminded date</text>

  <rect x="44" y="938" width="632" height="2" fill="#3C3732"/>
  <text x="44" y="966" fill="#82786F" font-size="16">Core callback → Pi UI notification</text>
</g>
</svg>