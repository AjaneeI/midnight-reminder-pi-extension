<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">Midnight Reminder decision flow</title>
<desc id="desc">Read local time. If outside midnight to 6 AM, do nothing. If inside the window but already reminded today, do nothing. Otherwise persist today's date and show the Pi reminder notification.</desc>
<rect width="720" height="1080" rx="24" fill="#0E0D0C"/>
<text x="44" y="62" fill="#B66A45" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="2">REMINDER DECISION FLOW</text>
<text x="44" y="106" fill="#F4E9DA" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="750">One path fires.</text>
<text x="44" y="144" fill="#B1A598" font-family="Inter,system-ui,sans-serif" font-size="18">Everything else stays quiet.</text>

<g font-family="Inter,system-ui,sans-serif">
  <rect x="82" y="196" width="556" height="92" rx="20" fill="#181613" stroke="#3C3732"/>
  <text x="112" y="236" fill="#F4E9DA" font-size="24" font-weight="700">1 · Read local time</text>
  <text x="112" y="266" fill="#B1A598" font-size="18">Clock.now()</text>

  <text x="360" y="326" text-anchor="middle" fill="#B66A45" font-size="26" font-weight="700">↓</text>

  <rect x="82" y="350" width="556" height="104" rx="20" fill="#181613" stroke="#3C3732"/>
  <text x="112" y="392" fill="#F4E9DA" font-size="24" font-weight="700">2 · Inside [00:00, 06:00)?</text>
  <text x="112" y="426" fill="#B1A598" font-size="18">No → no action</text>

  <text x="360" y="490" text-anchor="middle" fill="#B66A45" font-size="26" font-weight="700">↓ yes</text>

  <rect x="82" y="514" width="556" height="104" rx="20" fill="#181613" stroke="#3C3732"/>
  <text x="112" y="556" fill="#F4E9DA" font-size="24" font-weight="700">3 · Already reminded today?</text>
  <text x="112" y="590" fill="#B1A598" font-size="18">Yes → no duplicate</text>

  <text x="360" y="654" text-anchor="middle" fill="#B66A45" font-size="26" font-weight="700">↓ no</text>

  <rect x="82" y="678" width="556" height="96" rx="20" fill="#7A2E3A" stroke="#B66A45"/>
  <text x="112" y="718" fill="#F4E9DA" font-size="24" font-weight="700">4 · Persist today's date</text>
  <text x="112" y="748" fill="#F4E9DA" font-size="18">Write state before notifying</text>

  <text x="360" y="812" text-anchor="middle" fill="#B66A45" font-size="26" font-weight="700">↓</text>

  <rect x="82" y="836" width="556" height="96" rx="20" fill="#7A2E3A" stroke="#B66A45"/>
  <text x="112" y="876" fill="#F4E9DA" font-size="24" font-weight="700">5 · Show Pi notification</text>
  <text x="112" y="906" fill="#F4E9DA" font-size="18">Reminder fires once</text>

  <text x="44" y="986" fill="#82786F" font-size="15" font-weight="700" letter-spacing="1.4">BOUNDARIES VERIFIED</text>
  <text x="44" y="1024" fill="#F4E9DA" font-size="20" font-weight="650">23:59 quiet · 00:00 remind · 05:59 remind · 06:00 quiet</text>
</g>
</svg>